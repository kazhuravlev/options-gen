version: '3'

silent: true

tasks:
  default:
    cmds:
      - task --list-all

  check:
    desc: Run all project checks
    cmds:
      - echo "- Run all routines"
      - task: tidy
      - task: tools:install
      - task: generate
      - task: fmt
      - task: lint
      - task: tests
      - task: bench
      - task: scorecard
      - task: examples:update

  generate:
    desc: Generate code
    cmds:
      - echo "- Run codegen"
      - go generate ./options-gen/... ./internal/...

  tidy:
    cmds:
      - echo "- Tidy"
      - go mod tidy

  fmt:
    desc: Run code formatter
    cmds:
      - echo "- Format"
      - go fmt ./...

  tools:install:
    desc: Install required tools (into local project dir)
    run: once
    cmds:
      - echo "- Run install tools"
      - go run github.com/kazhuravlev/toolset/cmd/toolset@v0.40.0 sync

  lint:
    desc: Run linter
    cmds:
      - echo "- Lint"
      - task: 'tools:install'
      - toolset run golangci-lint run --fix ./...

  tests:
    cmds:
      - echo "- Tests"
      - go test ./...

  bench:
    desc: Run benchmarks of all packages once (BENCH=<regexp> narrows the set, default ".")
    vars:
      BENCH_PATTERN: '{{.BENCH | default "."}}'
    cmds:
      - echo "- Benchmarks"
      - go test -run '^$' -bench '{{.BENCH_PATTERN}}' -benchmem ./...

  bench:save:
    desc: "Run benchmarks COUNT (default 6) times and save them to BENCH_OUT (default /tmp/options-gen-bench.txt)"
    vars:
      BENCH_PATTERN: '{{.BENCH | default "."}}'
      BENCH_COUNT: '{{.COUNT | default "6"}}'
      BENCH_FILE: '{{.BENCH_OUT | default "/tmp/options-gen-bench.txt"}}'
    cmds:
      - echo "- Benchmarks x{{.BENCH_COUNT}} -> {{.BENCH_FILE}}"
      - set -o pipefail; go test -run '^$' -bench '{{.BENCH_PATTERN}}' -benchmem -count={{.BENCH_COUNT}} ./... | tee '{{.BENCH_FILE}}'

  bench:compare:
    desc: "Compare two saved benchmark runs with benchstat: task bench:compare OLD=<file> NEW=<file>"
    preconditions:
      - sh: test -n "{{.OLD}}" && test -n "{{.NEW}}"
        msg: "usage: task bench:compare OLD=<file> NEW=<file>"
      - sh: test -f "{{.OLD}}" && test -f "{{.NEW}}"
        msg: "OLD and NEW must be existing files produced by `task bench:save`"
    cmds:
      - echo "- Compare {{.OLD}} -> {{.NEW}}"
      - go run golang.org/x/perf/cmd/benchstat@latest '{{.OLD}}' '{{.NEW}}'

  scorecard:
    desc: Run OpenSSF Scorecard checks
    cmds:
      - echo "- OpenSSF Scorecard"
      - go run github.com/ossf/scorecard/v5@v5.5.0 --local=. --show-details

  fuzz:
    desc: Run fuzz tests
    cmds:
      - echo "- Fuzz tests"
      - go test -run '^$' -fuzz '^FuzzCheckDefaultValue$' -fuzztime=10s -timeout=30s ./internal/generator
      - go test -run '^$' -fuzz '^FuzzNormalizeTypeName$' -fuzztime=10s -timeout=30s ./internal/generator
      - go test -run '^$' -fuzz '^FuzzFormatComment$' -fuzztime=10s -timeout=30s ./internal/generator
      - go test -run '^$' -fuzz '^FuzzFindImportPath$' -fuzztime=10s -timeout=30s ./internal/generator

  examples:update:
    desc: Update examples directory
    cmds:
      - echo "- Update examples"
      - go install -ldflags "-X 'github.com/kazhuravlev/options-gen/internal/version.version=qa-version'" ./cmd/options-gen
      - task: examples:update:go-generate
      - task: examples:update:go-generate-generics
      - task: examples:update:go-generate-2options-1pkg
      - task: examples:update:library

  examples:update:library:
    dir: examples/library
    cmds:
      - go run main.go
      - go test .

  examples:update:go-generate:
    dir: examples/go-generate
    cmds:
      - go generate ./...

  examples:update:go-generate-generics:
    dir: examples/go-generate-generics
    cmds:
      - go generate ./...

  examples:update:go-generate-2options-1pkg:
    dir: examples/go-generate-2options-1pkg
    cmds:
      - go generate ./...
